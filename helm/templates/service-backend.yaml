apiVersion: v1
kind: Service
metadata:
  name: {{ include "grpc-studio.backendServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grpc-studio.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "grpc-studio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
