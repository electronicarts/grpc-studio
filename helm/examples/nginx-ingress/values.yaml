connection:
  targets:
    - name: My gRPC Server
      host: my-grpc-server.example.com
      port: 443
      mode: tls
    # Expose additional services in the same UI:
    # - name: Internal API
    #   host: internal-api.default.svc.cluster.local
    #   port: 50051
    #   mode: plaintext

auth:
  defaultPlugin: none

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: grpc-studio.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: grpc-studio-tls
      hosts:
        - grpc-studio.example.com
